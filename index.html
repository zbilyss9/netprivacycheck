<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Privacy Tools – Homepage</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo-text">Privacy Tools</div>
</header>

<section id="homepage">
  <h2 class="page-title">Homepage</h2>

  <h2>Your Public IP Address</h2>
  <div class="ip-box">
    <div class="ip-label">IP Address</div>
    <div class="ip-value" id="ip-value">Detecting…</div>

    <div class="grid" style="margin-top:1rem;">
      <div>
        <div class="ip-label">Location</div>
        <div class="ip-value" id="ip-location">Unknown</div>
      </div>
      <div>
        <div class="ip-label">ISP</div>
        <div class="ip-value" id="ip-isp">Unknown</div>
      </div>
    </div>
  </div>

  <h2>Run a Full Privacy Check</h2>
  <div class="grid">
    <div class="card"><h3>DNS Leak Test</h3><a href="#dns">Go →</a></div>
    <div class="card"><h3>WebRTC Leak Test</h3><a href="#webrtc">Go →</a></div>
    <div class="card"><h3>Browser Fingerprint</h3><a href="#fingerprint">Go →</a></div>
    <div class="card"><h3>User Agent</h3><a href="#ua">Go →</a></div>
    <div class="card"><h3>Port Checker</h3><a href="#port">Go →</a></div>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
